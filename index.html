<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeopardy 3x3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stage-lights" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <h1 class="logo">Jeopardy<span class="bang">!</span></h1>

  <div class="board" id="board">
    <!-- Kategorirubriker och rutor byggs av script.js -->
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="question-card">
      <p class="category-label" id="category-label"></p>
      <p class="question-text" id="question-text"></p>

      <button class="show-answer-btn" id="show-answer-btn">Visa svar</button>
      <p class="answer-text" id="answer-text" hidden></p>

      <button class="close-btn" id="close-btn">Stäng</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
